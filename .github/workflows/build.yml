name: Build and Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # ------------------------------------------------------------------
  # 1) Windows engine builds (3 parallel variants) + hard SIMD asserts
  #    gpu  = whisper.cpp Vulkan backend (GPU incl. Intel/AMD iGPUs),
  #           CPU-side ops still SSE2-capped so it runs on any x86_64 CPU
  #    fast = AVX2 CPU build
  #    safe = plain SSE2 CPU build (universal fallback)
  # ------------------------------------------------------------------
  engine:
    name: Engine (${{ matrix.variant }})
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        variant: [safe, fast, gpu]
        include:
          - variant: safe
            ggml_native: "OFF"
            ggml_avx: "OFF"
            ggml_avx2: "OFF"
            ggml_fma: "OFF"
            ggml_f16c: "OFF"
            cargo_extra: ""
          - variant: fast
            ggml_native: "OFF"
            ggml_avx: "ON"
            ggml_avx2: "ON"
            ggml_fma: "ON"
            ggml_f16c: "ON"
            cargo_extra: ""
          - variant: gpu
            ggml_native: "OFF"
            ggml_avx: "OFF"
            ggml_avx2: "OFF"
            ggml_fma: "OFF"
            ggml_f16c: "OFF"
            cargo_extra: "--features vulkan"
    env:
      TARJAMA_ENGINE_VARIANT: ${{ matrix.variant }}
      TARJAMA_GGML_NATIVE: ${{ matrix.ggml_native }}
      TARJAMA_GGML_AVX: ${{ matrix.ggml_avx }}
      TARJAMA_GGML_AVX2: ${{ matrix.ggml_avx2 }}
      TARJAMA_GGML_FMA: ${{ matrix.ggml_fma }}
      TARJAMA_GGML_F16C: ${{ matrix.ggml_f16c }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: engine-${{ matrix.variant }}
      - name: Assemble Vulkan SDK (installer-free)
        if: matrix.variant == 'gpu'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $sdk = "$env:RUNNER_TEMP\vksdk"
          New-Item -ItemType Directory -Force -Path "$sdk\Include","$sdk\Lib","$sdk\Bin" | Out-Null
          # 1) Vulkan headers (Khronos, small tarball)
          curl.exe -sL --retry 3 -o "$env:RUNNER_TEMP\vkhdr.tgz" "https://github.com/KhronosGroup/Vulkan-Headers/archive/refs/tags/v1.4.304.tar.gz"
          tar -xzf "$env:RUNNER_TEMP\vkhdr.tgz" -C "$env:RUNNER_TEMP"
          Copy-Item "$env:RUNNER_TEMP\Vulkan-Headers-1.4.304\include\*" "$sdk\Include" -Recurse -Force
          # 2) glslc.exe - EXTRACT (never execute) the LunarG SDK installer via 7-Zip
          curl.exe -sL --retry 3 -o "$env:RUNNER_TEMP\vk_inst.exe" "https://sdk.lunarg.com/sdk/download/latest/windows/vulkan-sdk.exe"
          $7z = "C:\Program Files\7-Zip\7z.exe"
          if (!(Test-Path $7z)) { choco install 7zip -y --no-progress }
          if (!(Test-Path $7z)) { $7z = "C:\ProgramData\chocolatey\lib\7zip\tools\7z.exe" }
          & $7z x -y "-o$env:RUNNER_TEMP\vkx" "$env:RUNNER_TEMP\vk_inst.exe" | Out-Null
          Copy-Item "$env:RUNNER_TEMP\vkx\Bin\glslc.exe" "$sdk\Bin\glslc.exe"
          # 3) Vulkan loader DLL (TEST ONLY, not shipped): MSYS2 build of the Khronos loader
          curl.exe -sL --retry 3 -o "$env:RUNNER_TEMP\vkloader.zst" "https://repo.msys2.org/mingw/mingw64/mingw-w64-x86_64-vulkan-loader-1~1.4.357.0-1-any.pkg.tar.zst"
          if (!(Test-Path "$env:RUNNER_TEMP\vkloader.zst")) { curl.exe -sL --retry 3 -o "$env:RUNNER_TEMP\vkloader.zst" "https://archive.msys2.org/mingw/mingw64/mingw-w64-x86_64-vulkan-loader-1~1.4.357.0-1-any.pkg.tar.zst" }
          # .zst packages need the real zstd tool (runner 7-Zip may lack zstd support)
          curl.exe -sL --retry 3 -o "$env:RUNNER_TEMP\zstd.zip" "https://github.com/facebook/zstd/releases/download/v1.5.7/zstd-v1.5.7-win64.zip"
          Expand-Archive "$env:RUNNER_TEMP\zstd.zip" -DestinationPath "$env:RUNNER_TEMP\zstd" -Force
          & "$env:RUNNER_TEMP\zstd\zstd-v1.5.7-win64\zstd.exe" -d -q "$env:RUNNER_TEMP\vkloader.zst" -o "$env:RUNNER_TEMP\vkloader.tar"
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP\vkloader2" | Out-Null
          tar -xf "$env:RUNNER_TEMP\vkloader.tar" -C "$env:RUNNER_TEMP\vkloader2"
          if (!(Test-Path "$env:RUNNER_TEMP\vkloader2\mingw64\bin\vulkan-1.dll")) { Write-Error "vulkan-1.dll not found in MSYS2 loader package"; exit 1 }
          Copy-Item "$env:RUNNER_TEMP\vkloader2\mingw64\bin\vulkan-1.dll" "$env:RUNNER_TEMP\vulkan-1.dll"
          # 4) import library source (def) - converted to .lib in the next step
          curl.exe -sL --retry 3 -o "$env:RUNNER_TEMP\vulkan-1.def" "https://raw.githubusercontent.com/KhronosGroup/Vulkan-Loader/v1.4.304/loader/vulkan-1.def"
          "VULKAN_SDK=$sdk" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "VULKAN_SDK=$sdk"
          & "$sdk\Bin\glslc.exe" --version
          Get-ChildItem $sdk -Recurse -File | Select-Object FullName,Length
      - name: Set up MSVC dev environment (gpu)
        if: matrix.variant == 'gpu'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Generate vulkan-1.lib from def (gpu)
        if: matrix.variant == 'gpu'
        shell: cmd
        run: lib /nologo /def:"%RUNNER_TEMP%\vulkan-1.def" /machine:x64 /out:"%VULKAN_SDK%\Lib\vulkan-1.lib"
      - name: Build engine (${{ matrix.variant }})
        run: cargo build --release -p tarjama-engine ${{ matrix.cargo_extra }}
      - name: Vulkan-specific verification (gpu)
        if: matrix.variant == 'gpu'
        shell: bash
        run: |
          # The exe imports vulkan-1.dll; on this GPU-less runner the test-only
          # MSYS2 loader must sit next to the exe for it to start. Real user
          # machines get the loader from their GPU driver.
          cp "$RUNNER_TEMP/vulkan-1.dll" target/release/
          ./target/release/tarjama-engine.exe --capabilities
          n=$(grep -ci "vulkan-1.dll" target/release/tarjama-engine.exe || true)
          echo "vulkan-1.dll import references: $n"
          [ "$n" -ge 1 ] || { echo "::error::gpu engine does not import vulkan-1.dll - Vulkan backend missing"; exit 1; }
      - name: Assert compiled SIMD flags
        shell: bash
        run: |
          caps=$(./target/release/tarjama-engine.exe --capabilities)
          echo "capabilities: $caps"
          case "${{ matrix.variant }}" in
            safe)
              echo "$caps" | grep -q "avx2=0"  || { echo "::error::SAFE build contains AVX2!"; exit 1; }
              echo "$caps" | grep -q "avx=0"   || { echo "::error::SAFE build contains AVX!";  exit 1; }
              echo "$caps" | grep -q "fma=0"   || { echo "::error::SAFE build contains FMA!";  exit 1; }
              echo "$caps" | grep -q "avx512=0" || { echo "::error::SAFE build contains AVX512!"; exit 1; }
              echo "OK: safe engine is plain SSE2 - runs on every x86_64 CPU"
              ;;
            fast)
              echo "$caps" | grep -q "avx2=1"  || { echo "::error::FAST build lacks AVX2!"; exit 1; }
              echo "$caps" | grep -q "fma=1"   || { echo "::error::FAST build lacks FMA!";  exit 1; }
              echo "OK: fast engine has AVX2+FMA+F16C"
              ;;
            gpu)
              echo "$caps" | grep -q "avx2=0"  || { echo "::error::GPU build has AVX2 CPU ops - would crash no-AVX2 CPUs!"; exit 1; }
              echo "$caps" | grep -q "avx=0"   || { echo "::error::GPU build has AVX CPU ops!"; exit 1; }
              echo "$caps" | grep -q "vulkan=1" || { echo "::error::GPU build lacks the Vulkan backend!"; exit 1; }
              echo "OK: gpu engine = Vulkan backend + SSE2-capped CPU (safe on any CPU, GPU when present)"
              ;;
          esac
      - name: Upload engine artifact
        uses: actions/upload-artifact@v4
        with:
          name: engine-${{ matrix.variant }}
          path: target/release/tarjama-engine.exe

  # ------------------------------------------------------------------
  # 2) Windows GUI build
  # ------------------------------------------------------------------
  gui:
    name: GUI (Windows)
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: gui
      - name: Build GUI
        run: cargo build --release -p tarjama-gui
      - name: Upload GUI artifact
        uses: actions/upload-artifact@v4
        with:
          name: gui-windows
          path: target/release/tarjama.exe

  # ------------------------------------------------------------------
  # 3) Linux: build, then RUN the real E2E tests on the GitHub runner
  #    (engine selftest, full video->subtitles pipeline, GUI autotest
  #     under Xvfb incl. engine-crash fallback verification)
  # ------------------------------------------------------------------
  linux-test:
    name: Linux E2E test (run binaries)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: linux-test
      - name: Install Xvfb + ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libxkbcommon-x11-0 ffmpeg
      - name: Build (release)
        run: cargo build --release -p tarjama-engine -p tarjama-gui
      - name: Download tiny whisper model
        run: |
          mkdir -p models
          curl -sL --retry 5 -o models/ggml-tiny-q8_0.bin https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny-q8_0.bin
          ls -la models
      - name: Engine selftest (tiny + MT, real run)
        run: ./target/release/tarjama-engine --selftest
      - name: Make short test video
        run: |
          mkdir -p testout
          ffmpeg -y -f lavfi -i color=c=blue:s=320x240:d=7 -i crates/tarjama-engine/assets/selftest_tr.wav -c:v libx264 -pix_fmt yuv420p -c:a aac -shortest testout/test.mp4
          ffprobe -v error -show_entries format=duration -of csv=p=0 testout/test.mp4
      - name: Full pipeline on test video (tiny, real run)
        run: |
          export TARJAMA_MODELS_DIR=$PWD/models
          ./target/release/tarjama-engine --cli --input testout/test.mp4 --model tiny --out testout/ep1
          echo "--- ep1.ar.srt ---"; cat testout/ep1.ar.srt
          perl -CSD -ne 'BEGIN{$ok=0} $ok=1 if /[\x{0600}-\x{06FF}]/; END{exit($ok?0:1)}' testout/ep1.ar.srt || { echo "::error::no Arabic in output"; exit 1; }
          test -s testout/ep1.bilingual.srt && test -s testout/ep1.ar.vtt && test -s testout/ep1.ar.txt && test -s testout/ep1.tr.txt
          echo "PIPELINE OK"
      - name: GUI autotest under Xvfb (incl. crash-fallback)
        timeout-minutes: 12
        run: |
          cp target/release/tarjama-engine target/release/tarjama-engine-safe
          # simulate a crashing fast engine AND a crashing gpu engine:
          # GUI must walk gpu -> fast -> safe and land on safe
          export TARJAMA_ENGINE_GPU=/bin/false
          export TARJAMA_ENGINE_FAST=/bin/false
          export TARJAMA_MODELS_DIR=$PWD/models
          export TARJAMA_AUTOTEST=1
          export TARJAMA_AUTOTEST_FILE=$PWD/testout/test.mp4
          export TARJAMA_AUTOTEST_MODEL=tiny
          rm -f /tmp/tarjama_autotest_ok
          Xvfb :99 -screen 0 1280x900x24 &
          XvfbPid=$!
          sleep 2
          export DISPLAY=:99
          ./target/release/tarjama > /tmp/gui_autotest.log 2>&1 &
          GuiPid=$!
          # wait for the app to be up and take an early screenshot
          sleep 6
          ffmpeg -y -f x11grab -video_size 1280x900 -i :99 -frames:v 1 testout/gui_startup.png || true
          # wait for the completion marker (max 300s)
          for i in $(seq 1 300); do
            [ -f /tmp/tarjama_autotest_ok ] && break
            sleep 1
          done
          sleep 3
          ffmpeg -y -f x11grab -video_size 1280x900 -i :99 -frames:v 1 testout/gui_results.png || true
          kill $GuiPid 2>/dev/null || true
          kill $XvfbPid 2>/dev/null || true
          echo "--- gui autotest log ---"; cat /tmp/gui_autotest.log
          test -f /tmp/tarjama_autotest_ok || { echo "::error::GUI autotest marker missing"; exit 1; }
          marker=$(cat /tmp/tarjama_autotest_ok)
          echo "marker: $marker"
          echo "$marker" | grep -q "variant=safe" || { echo "::error::fallback to safe engine did not happen"; exit 1; }
          echo "$marker" | grep -qE "^[0-9]+ " || { echo "::error::no segments produced"; exit 1; }
          echo "GUI AUTOTEST OK (crash fallback verified)"
      - name: Upload Linux test evidence
        uses: actions/upload-artifact@v4
        with:
          name: linux-test-evidence
          path: |
            testout/ep1.ar.srt
            testout/ep1.bilingual.srt
            testout/ep1.tr.txt
            testout/gui_startup.png
            testout/gui_results.png

  # ------------------------------------------------------------------
  # 4) Package the Windows zip and RUN the shipped exes on the runner
  # ------------------------------------------------------------------
  package:
    name: Package + run shipped exes (Windows)
    needs: [engine, gui]
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Cache whisper models
        id: modelcache
        uses: actions/cache@v4
        with:
          path: models
          key: ggml-q8_0-models-v1
      - name: Download whisper models (tiny/base/small only)
        if: steps.modelcache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p models
          curl -sL --retry 5 -o models/ggml-tiny-q8_0.bin  https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny-q8_0.bin
          curl -sL --retry 5 -o models/ggml-base-q8_0.bin  https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-base-q8_0.bin
          curl -sL --retry 5 -o models/ggml-small-q8_0.bin https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-small-q8_0.bin
          ls -la models
      - name: Verify all three models present (tiny/base/small ONLY)
        shell: bash
        run: |
          for f in ggml-tiny-q8_0.bin ggml-base-q8_0.bin ggml-small-q8_0.bin; do
            test -s "models/$f" || { echo "::error::missing $f"; exit 1; }
          done
          n=$(ls models/*.bin 2>/dev/null | wc -l)
          echo "model files: $n (must be exactly 3)"
          test "$n" = "3" || { echo "::error::unexpected extra models"; exit 1; }
      - name: Cache ffmpeg
        id: ffmpegcache
        uses: actions/cache@v4
        with:
          path: ffmpeg.exe
          key: ffmpeg-win64-gpl-v1
      - name: Download ffmpeg (bundled)
        if: steps.ffmpegcache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          curl -sL --retry 5 -o ffmpeg.zip https://github.com/BtbN/FFmpeg-Builds/releases/latest/download/ffmpeg-master-latest-win64-gpl.zip
          unzip -o -q ffmpeg.zip -d ffmpeg_dist
          find ffmpeg_dist -name ffmpeg.exe -exec cp {} ./ffmpeg.exe \;
          ./ffmpeg.exe -version | head -2
      - name: Download built exes
        uses: actions/download-artifact@v4
        with:
          pattern: "{engine-safe,engine-fast,engine-gpu,gui-windows}"
          path: artifacts
      - name: Assemble portable folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/tarjama/models | Out-Null
          Copy-Item artifacts/gui-windows/tarjama.exe dist/tarjama/
          Copy-Item artifacts/engine-safe/tarjama-engine.exe dist/tarjama/tarjama-engine-safe.exe
          Copy-Item artifacts/engine-fast/tarjama-engine.exe dist/tarjama/tarjama-engine-fast.exe
          Copy-Item artifacts/engine-gpu/tarjama-engine.exe dist/tarjama/tarjama-engine-gpu.exe
          Copy-Item ffmpeg.exe dist/tarjama/
          Copy-Item README.txt dist/tarjama/
          Copy-Item models/ggml-tiny-q8_0.bin  dist/tarjama/models/
          Copy-Item models/ggml-base-q8_0.bin  dist/tarjama/models/
          Copy-Item models/ggml-small-q8_0.bin dist/tarjama/models/
          Copy-Item models/mt -Destination dist/tarjama/models -Recurse
          Get-ChildItem -Recurse dist | Select-Object FullName,Length
      - name: RUN shipped safe engine selftest (all models + MT)
        shell: bash
        run: |
          export TARJAMA_MODELS_DIR=$PWD/dist/tarjama/models
          export TARJAMA_SELFTEST_REQUIRE=all
          ./dist/tarjama/tarjama-engine-safe.exe --selftest
      - name: Assert fast engine caps (AVX2)
        shell: bash
        run: |
          caps=$(./dist/tarjama/tarjama-engine-fast.exe --capabilities)
          echo "$caps"
          echo "$caps" | grep -q "avx2=1" || { echo "::error::fast engine lacks AVX2"; exit 1; }
      - name: Assert GPU engine caps + startability
        shell: bash
        run: |
          # TEST-ONLY loader: the GPU-less runner has no vulkan-1.dll, so drop
          # the MSYS2 Khronos loader next to the exe for this test. It is NOT
          # shipped in the zip - real machines get the loader from GPU drivers.
          curl -sL --retry 3 -o zstd.zip "https://github.com/facebook/zstd/releases/download/v1.5.7/zstd-v1.5.7-win64.zip"
          unzip -o -q zstd.zip -d zstd_dist
          curl -sL --retry 3 -o vulkan-1.dll.zst "https://repo.msys2.org/mingw/mingw64/mingw-w64-x86_64-vulkan-loader-1~1.4.357.0-1-any.pkg.tar.zst"
          ./zstd_dist/zstd-v1.5.7-win64/zstd.exe -d -q vulkan-1.dll.zst -o vkloader.tar
          tar -xf vkloader.tar
          cp mingw64/bin/vulkan-1.dll dist/tarjama/vulkan-1.dll
          caps=$(cd dist/tarjama && ./tarjama-engine-gpu.exe --capabilities)
          echo "$caps"
          echo "$caps" | grep -q "avx2=0"   || { echo "::error::gpu engine has AVX2 CPU ops"; exit 1; }
          echo "$caps" | grep -q "vulkan=1" || { echo "::error::gpu engine lacks Vulkan backend"; exit 1; }
          echo "OK: GPU engine starts with test loader (CPU fallback on this runner)"
      - name: Make short test video
        shell: bash
        run: |
          mkdir -p testout
          FF=""
          if [ -x dist/tarjama/ffmpeg.exe ]; then FF=./dist/tarjama/ffmpeg.exe; fi
          if [ -z "$FF" ]; then FF=$(command -v ffmpeg || true); fi
          if [ -z "$FF" ]; then
            curl -sL --retry 5 -o ffmpeg.zip https://github.com/BtbN/FFmpeg-Builds/releases/latest/download/ffmpeg-master-latest-win64-gpl.zip
            unzip -o -q ffmpeg.zip -d ffmpeg_dist
            find ffmpeg_dist -name ffmpeg.exe -exec cp {} ./ffmpeg.exe \;
            FF=./ffmpeg.exe
          fi
          echo "using ffmpeg: $FF"
          "$FF" -y -f lavfi -i color=c=blue:s=320x240:d=7 -i crates/tarjama-engine/assets/selftest_tr.wav -c:v libx264 -pix_fmt yuv420p -c:a aac -shortest testout/test.mp4
          ls -la testout
      - name: RUN full pipeline with shipped safe engine (tiny on test video)
        shell: bash
        run: |
          export TARJAMA_MODELS_DIR=$PWD/dist/tarjama/models
          ./dist/tarjama/tarjama-engine-safe.exe --cli --input testout/test.mp4 --model tiny --out testout/ep1
          echo "--- ep1.ar.srt ---"; cat testout/ep1.ar.srt
          perl -CSD -ne 'BEGIN{$ok=0} $ok=1 if /[\x{0600}-\x{06FF}]/; END{exit($ok?0:1)}' testout/ep1.ar.srt || { echo "::error::no Arabic in output"; exit 1; }
          echo "SHIPPED ENGINE E2E OK"
      - name: RUN full pipeline with shipped fast engine
        shell: bash
        run: |
          export TARJAMA_MODELS_DIR=$PWD/dist/tarjama/models
          ./dist/tarjama/tarjama-engine-fast.exe --cli --input testout/test.mp4 --model tiny --out testout/ep1fast
          perl -CSD -ne 'BEGIN{$ok=0} $ok=1 if /[\x{0600}-\x{06FF}]/; END{exit($ok?0:1)}' testout/ep1fast.ar.srt || { echo "::error::no Arabic (fast engine)"; exit 1; }
          echo "FAST ENGINE E2E OK"
      - name: RUN full pipeline with shipped GPU engine (CPU fallback on runner)
        shell: bash
        run: |
          export TARJAMA_MODELS_DIR=$PWD/dist/tarjama/models
          ./dist/tarjama/tarjama-engine-gpu.exe --cli --input testout/test.mp4 --model tiny --out testout/ep1gpu
          echo "--- ep1gpu.ar.srt ---"; cat testout/ep1gpu.ar.srt
          perl -CSD -ne 'BEGIN{$ok=0} $ok=1 if /[\x{0600}-\x{06FF}]/; END{exit($ok?0:1)}' testout/ep1gpu.ar.srt || { echo "::error::no Arabic (gpu engine)"; exit 1; }
          echo "GPU ENGINE E2E OK (no GPU on runner -> exercised the automatic CPU fallback path)"
      - name: Remove test-only Vulkan loader before packaging
        shell: bash
        run: |
          rm -f dist/tarjama/vulkan-1.dll
          echo "test-only loader removed (users get it from their GPU driver)"
      - name: GUI smoke test on Windows (best effort)
        id: guitest
        continue-on-error: true
        shell: bash
        run: |
          export TARJAMA_MODELS_DIR=$PWD/dist/tarjama/models
          export TARJAMA_AUTOTEST=1
          export TARJAMA_AUTOTEST_FILE=$PWD/testout/test.mp4
          export TARJAMA_AUTOTEST_MODEL=tiny
          rm -f "$TEMP/tarjama_autotest_ok"
          ./dist/tarjama/tarjama.exe > gui_autotest.log 2>&1 &
          for i in $(seq 1 150); do
            [ -f "$TEMP/tarjama_autotest_ok" ] && break
            sleep 1
          done
          cat gui_autotest.log || true
          if [ -f "$TEMP/tarjama_autotest_ok" ]; then
            echo "marker: $(cat "$TEMP/tarjama_autotest_ok")"
            echo "GUI WINDOWS AUTOTEST OK"
          else
            echo "::warning::GUI autotest inconclusive on headless runner (window session may be unavailable)"
            exit 1
          fi
      - name: Package portable zip
        shell: pwsh
        run: |
          Compress-Archive -Path dist/tarjama -DestinationPath TarjamaNative-Windows-x64.zip
          Get-Item TarjamaNative-Windows-x64.zip | Select-Object Name,Length
      - name: Verify zip contents
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $z = [System.IO.Compression.ZipFile]::OpenRead("$PWD/TarjamaNative-Windows-x64.zip")
          $names = $z.Entries.FullName
          $z.Dispose()
          @("tarjama/tarjama.exe","tarjama/tarjama-engine-safe.exe","tarjama/tarjama-engine-fast.exe","tarjama/tarjama-engine-gpu.exe","tarjama/ffmpeg.exe",
            "tarjama/models/ggml-tiny-q8_0.bin","tarjama/models/ggml-base-q8_0.bin","tarjama/models/ggml-small-q8_0.bin",
            "tarjama/models/mt/tr-ar/encoder_model.int8.onnx","tarjama/models/mt/tr-ar/decoder_with_past_model.int8.onnx") | ForEach-Object {
            if ($names -notcontains $_) { Write-Error "missing in zip: $_"; exit 1 } else { Write-Host "ok $_" }
          }
      - name: Upload Windows zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: TarjamaNative-Windows-x64
          path: TarjamaNative-Windows-x64.zip

  # ------------------------------------------------------------------
  # 5) Release
  # ------------------------------------------------------------------
  release:
    name: Publish release
    needs: [package, linux-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: TarjamaNative-Windows-x64
          path: .
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.3.${{ github.run_number }}
          name: Tarjama Studio Native v1.3.${{ github.run_number }}
          body: |
            Portable, fully offline Windows build (x64). Unzip and run tarjama.exe.

            v1.3: SUBTITLE QUALITY OVERHAUL - translation and transcription accuracy
            now match the web studio much more closely.
            - Whisper models upgraded from 5-bit q5_1 to 8-bit q8_0 (near-lossless,
              same precision class as the web app's int8 models).
            - Whisper now decodes with beam search (beam 5) instead of greedy,
              and no longer carries previous text as context (prevents
              hallucination loops on music/repeats), matching the web pipeline.
            - Translation engine rebuilt: OPUS-MT (ONNX int8) now decodes with
              BEAM SEARCH (beam 4, length penalty 0.2) instead of greedy - this
              was the biggest single quality jump. Verified sentence-by-sentence
              against reference translations.
            - Stray quotation-mark artifacts from the ASR are stripped before
              translation and subtitles.
            - GPU (Vulkan) acceleration from v1.2 unchanged: gpu -> fast -> safe
              engine auto-fallback. TARJAMA_NO_GPU=1 forces CPU.

            Bundled models (Tiny 43 MB, Base 80 MB, Small 270 MB q8_0 + OPUS-MT tr->ar int8 beam).
            For best quality pick the Small model. ffmpeg.exe included. No internet, no downloads.
          files: TarjamaNative-Windows-x64.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

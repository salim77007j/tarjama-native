[workspace]
resolver = "2"
members = [
    "crates/tarjama-core",
    "crates/tarjama-engine",
    "crates/tarjama-gui",
]

# Deterministic SSE2-only builds of the vendored whisper.cpp on every machine:
# the stock crate baked build-machine SIMD (/arch:AVX2 via FindSIMD) into the
# exe, crashing on CPUs without AVX2. See vendor/whisper-rs-sys/build.rs.
[patch.crates-io]
whisper-rs-sys = { path = "vendor/whisper-rs-sys" }

[workspace.package]
version = "1.2.0"
edition = "2021"
license = "MIT"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

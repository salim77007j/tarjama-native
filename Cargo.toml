[package]
name = "tarjama"
version = "1.0.0"
edition = "2021"
description = "Tarjama Studio Native - Turkish video/audio to Arabic subtitles, fully offline, no web tech"
license = "MIT"

[[bin]]
name = "tarjama"
path = "src/main.rs"

[dependencies]
whisper-rs = "0.13.2"
ort = "=2.0.0-rc.10"
tokenizers = "0.21"
iced = { version = "0.13.1", default-features = false, features = ["tiny-skia", "tokio", "auto-detect-theme"] }
rfd = "0.15"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
open = "5"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[package]
name = "tarjama-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Tarjama Studio Native - native GUI (no web tech); runs the engine in a crash-isolated subprocess"

[[bin]]
name = "tarjama"
path = "src/main.rs"

[dependencies]
tarjama-core = { path = "../tarjama-core" }
iced = { version = "0.13.1", default-features = false, features = ["tiny-skia", "tokio", "auto-detect-theme"] }
rfd = "0.15"
anyhow = "1"
serde_json = "1"
open = "5"

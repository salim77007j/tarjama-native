[package]
name = "tarjama-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Offline TR->AR pipeline engine (whisper.cpp + ONNX MT), crash-isolated subprocess"

[[bin]]
name = "tarjama-engine"
path = "src/main.rs"

[dependencies]
tarjama-core = { path = "../tarjama-core" }
whisper-rs = "0.13.2"
ort = "=2.0.0-rc.10"
tokenizers = "0.21"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
ash = "0.38"

[features]
# GPU engine build: whisper.cpp with the Vulkan compute backend (works on
# Intel/AMD/NVIDIA GPUs incl. most integrated graphics). CPU-side ggml ops
# stay SSE2-capped via TARJAMA_GGML_* so the binary still runs everywhere.
# whisper-cpp-log routes whisper.cpp/ggml logs into the `log` crate so the
# engine can report which compute backend actually ran.
vulkan = ["whisper-rs/vulkan", "whisper-rs/whisper-cpp-log"]
